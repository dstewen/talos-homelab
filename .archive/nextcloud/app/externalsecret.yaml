---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nextcloud-secret
    template:
      data:
        # App
        ADMIN_USER: "{{ .username }}"
        ADMIN_PASS: "{{ .password }}"
#        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        SMTP_USERNAME: ""
        SMTP_PASSWORD: ""
        SMTP_HOST: smtp-relay.home.svc.cluster.local
        # Database
        POSTGRES_HOST: &dbhost "postgres18-rw.database.svc.cluster.local"
        POSTGRES_USER: &dbuser "{{ .NEXTCLOUD_POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbpass "{{ .NEXTCLOUD_POSTGRES_PASSWORD }}"
        POSTGRES_DB: &dbname "{{ .NEXTCLOUD_POSTGRES_DB }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # OIDC
        OIDC_CLIENT_ID: "{{ .NEXTCLOUD_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .NEXTCLOUD_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: nextcloud
    - extract:
        key: cloudnative-pg
