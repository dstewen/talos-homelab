---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app meshcentral
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: meshcentral
  values:
    controllers:
      meshcentral:
        annotations:
          secret.reloader.stakater.com/reload: meshcentral-config
        containers:
          app:
            image:
              repository: ghcr.io/ylianst/meshcentral
              tag: 1.2.5
            env:
              TZ: "Australia/Melbourne"
              NODE_ENV: production
              HOSTNAME: mesh2.davidstewen.com
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 8080

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: "MeshCentral"
          gethomepage.dev/group: Network
          gethomepage.dev/name: MeshCentral
          gethomepage.dev/href: https://mesh2.davidstewen.com
          gethomepage.dev/icon: sh-meshcentral.png
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=meshcentral
          hajimari.io/enable: "true"
          hajimari.io/appName: "MeshCentral"
          hajimari.io/info: "Intel-vPro"
          hajimari.io/icon: "refresh-auto"
          external-dns.alpha.kubernetes.io/target: "mesh2.davidstewen.com"
        hostnames: ["mesh2.davidstewen.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        type: configMap
        name: meshcentral-config
        advancedMounts:
          meshcentral:
            app:
              - path: /opt/meshcentral/meshcentral-data/config.json
                subPath: config.json
      data:
        existingClaim: meshcentral-data
        globalMounts:
          - path: /root
            subPath: rootdir
          - path: /opt/meshcentral/meshcentral-data
            subPath: data
          - path: /opt/meshcentral/meshcentral-files
            subPath: userfiles
          - path: /opt/meshcentral/meshcentral-backups
            subPath: backups
