---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: authentik
  values:
    global:
      podAnnotations:
        secret.reloader.stakater.com/reload: &secret authentik-secret
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: *secret
      addPrometheusAnnotations: false
#      nodeSelector:
#        node-role.kubernetes.io/worker: worker
#      affinity:
#        nodeAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#            nodeSelectorTerms:
#            - matchExpressions:
#              - key: node-role.kubernetes.io/worker
#                operator: In
#                values:
#                - worker
#          preferredDuringSchedulingIgnoredDuringExecution:
#          - weight: 50
#            preference:
#              matchExpressions:
#              - key: kubernetes.io/arch
#                operator: In
#                values:
#                - arm64

    authentik:
      log_level: info
      avatars: "gravatar,initials"
      email:
        host: smtp-relay.home.svc.cluster.local
        port: 2525
        from: "Access <dstewen@internode.on.net>"
      error_reporting:
        enable: false
        send_pii: false
    prometheus:
      rules:
        enabled: true
    server:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
#        targetCPUUtilizationPercentage: 50
      pdb:
        enabled: true
        minAvailable: 1
        maxUnavailable: 1
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.3.0@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
          envFrom:
            - secretRef:
                name: *secret
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      startupProbe:
        initialDelaySeconds: 60
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi
      ingress:
        enabled: false
#      ingress:
#        enabled: true
#        ingressClassName: internal
#        annotations:
#          hajimari.io/enable: "true"
#          hajimari.io/icon: simple-icons:webauthn
#          hajimari.io/group: Security
#          hajimari.io/appName: Authentik
#          hajimari.io/url: "https://id.${SECRET_DOMAIN}"
#          gethomepage.dev/enabled: "true"
#          gethomepage.dev/icon: authentik.png
#          gethomepage.dev/name: Authentik
#          gethomepage.dev/group: Infrastructure
#          gethomepage.dev/description: OIDC User Management
##          gethomepage.dev/widget.type: authentik
##          gethomepage.dev/widget.url: http://authentik-server.security.svc.cluster.local:9000
##          gethomepage.dev/widget.key: "{{AUTHENTIK_HOMEPAGE_TOKEN}}"
#          gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik
#          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
#        hosts:
#          - "id.${SECRET_DOMAIN}"
#        https: false

    worker:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                - worker
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
#        targetCPUUtilizationPercentage: 50
      image:
        repository: ghcr.io/goauthentik/server
        digest: sha256:feb81e02f7af70469c87c8a4fbfdb148647ae7a3ee5f79f8b08b7ee02b98c4c9
        tag: 2026.5.0
      pdb:
        enabled: true
        minAvailable: 1
        maxUnavailable: 1
      startupProbe:
        initialDelaySeconds: 60
      resources:
        requests:
          cpu: 500m
          memory: 300M
        limits:
          cpu: 2000m
          memory: 2Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
