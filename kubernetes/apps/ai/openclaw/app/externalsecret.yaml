---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        ## Gateway token for authentication
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        ##Discord
#        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
#        MATCHA_BOT_TOKEN: "{{ .MATCHA_BOT_TOKEN }}"
        ##Discord
        SLACK_BOT_USER_OAUTH_TOKEN: "{{ .SLACK_BOT_USER_OAUTH_TOKEN }}"
        SLACK_SIGNING_SECRET: "{{ .SLACK_SIGNING_SECRET }}"
        SLACK_TALOS_HOMELAB_APP_TOKEN: "{{ .SLACK_TALOS_HOMELAB_APP_TOKEN }}"
#        MATCHA_BOT_TOKEN: "{{ .MATCHA_BOT_TOKEN }}"
        ## GH Access
#        GITHUB_APP_CLIENT_ID: "{{ .MISO_BOT_CLIENT_ID }}"
#        GITHUB_APP_CLIENT_SECRET: "{{ .MISO_BOT_CLIENT_SECRET }}"
#        GITHUB_APP_ID: "{{ .MISO_BOT_ID }}"
#        GITHUB_APP_INSTALLATION_ID: "{{ .MISO_BOT_INSTALLATION_ID }}"
#        GITHUB_APP_PRIVATE_KEY: "{{ .MISO_BOT_PRIVATE_KEY }}"
        ## API Keys
#        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
#        GOOGLE_AI_STUDIO_API_KEY: "{{ .GOOGLE_GEMINI_API_KEY }}"
#        CEREBRAS_API_KEY: "{{ .CEREBRAS_API_KEY }}"
#        GROQ_API_KEY: "{{ .GROQ_API_KEY }}"
#        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
#        KIMI_CODING_API_KEY: "{{ .KIMI_CODE_API_KEY }}"
#        MINIMAX_API_KEY: "{{ .MINIMAX_API_KEY }}"
        ## HASS
#        HA_URL: "https://hass.jory.dev"
#        HA_TOKEN: "{{ .HOME_ASSISTANT_TOKEN }}"
        ## META
#        COMMONS_API_KEY: "{{ .AGENTCOMMONS_API_KEY }}"
#        INSTAGRAM_BASIC_TOKEN: "{{ .INSTAGRAM_BASIC_TOKEN }}"
#        INSTAGRAM_GRAPH_TOKEN: "{{ .INSTAGRAM_GRAPH_TOKEN }}"
#        FACEBOOK_APP_ID: "{{ .FACEBOOK_APP_ID }}"
#        FACEBOOK_APP_SECRET: "{{ .FACEBOOK_APP_SECRET }}"
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: slackapi
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        ## OpenClaw configuration file
        openclaw.json: |
          {
            "agents": {
              "defaults": {
                "model": {
                  "primary": "openai-codex/gpt-4o",
                  "fallbacks": [
                    "localai/qwen2.5-coder:7b"
                  ]
                },
                "maxConcurrent": 4,
                "timeoutSeconds": 300
              },
              "list": [
                {
                  "id": "main",
                  "default": true,
                  "name": "C.O.R.T.E.X",
                  "workspace": "/home/node/.openclaw/workspace",
                  "agentDir": "/home/node/.openclaw/agents/main/agent"
                }
              ]
            },
            "models": {
              "providers": {
                "localai": {
                  "baseUrl": "http://local-ai.ai.svc.cluster.local:8080/v1",
                  "apiKey": "not-needed",
                  "api": "openai-completions",
                  "models": [
                    {
                      "id": "mistral-7b-instruct",
                      "name": "Mistral 7B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    },
                    {
                      "id": "qwen2.5-coder:7b",
                      "name": "Qwen 2.5 Coder 7B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    },
                    {
                      "id": "qwen2.5-coder:14b",
                      "name": "Qwen 2.5 Coder 14B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    }
                  ]
                }
              }
            },
            "auth": {
              "profiles": {
                "openai-codex:default": {
                  "provider": "openai-codex",
                  "mode": "oauth"
                }
              }
            },
            "channels": {
              "slack": {
                "enabled": true,
                "mode": "socket",
                "botToken": "{{ .SLACK_BOT_USER_OAUTH_TOKEN }}",
                "appToken": "{{ .SLACK_TALOS_HOMELAB_APP_TOKEN }}",
                "actions": {
                  "messages": true,
                  "search": true,
                  "reactions": false,
                  "permissions": false,
                  "pins": false,
                  "channelInfo": false,
                },
              }
            },
            "gateway": {
              "auth": { "mode": "token", token: "{{ .OPENCLAW_GATEWAY_TOKEN }}" },
              "controlUi": { allowedOrigins: ["https://openclaw.davidstewen.com", "https://openclaw-chat.davidstewen.com"],},
              "mode": "local",
              "port": 18789,
              "trustedProxies": ["10.42.0.0/16", "192.168.0.0/16"]
            },
            "messages": {
              "ackReactionScope": "group-mentions",
              "responsePrefix": "[{provider}/{model}]"
            }
          }
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: slackapi
