---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-xunholy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openclaw-xunholy-secret
    template:
      data:
#        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
#        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
#        OPENCLAW_GATEWAY_PASSWORD: "{{ .OPENCLAW_GATEWAY_PASSWORD }}"
        SLACK_APP_TOKEN: "{{ .SLACK_OPENCLAW_APP_TOKEN }}"
        SLACK_BOT_TOKEN: "{{ .SLACK_OPENCLAW_BOT_USER_OAUTH_TOKEN }}"
        SLACK_BOT_USER_OAUTH_TOKEN: "{{ .SLACK_BOT_USER_OAUTH_TOKEN }}"
#        SLACK_SIGNING_SECRET: "{{ .SLACK_OPENCLAW_APP_SIGNING_SECRET }}"
        SLACK_TALOS_HOMELAB_APP_TOKEN: "{{ .SLACK_TALOS_HOMELAB_APP_TOKEN }}"
        SLACK_USERID_ME: "{{ .SLACK_USERID_ME }}"
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: slackapi
---
# yaml-language-server: $schema=https://kubernetes-schemas.nerdz.cloud/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-xunholy-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        openclaw.json: |
          {
            "agents": {
              "defaults": {
                "model": {
                  "primary": "openai-codex/gpt-4o",
                  "fallbacks": [
                    "localai/qwen2.5-coder:7b"
                  ]
                },
                "maxConcurrent": 4,
                "timeoutSeconds": 300
              },
              "list": [
                {
                  "id": "main",
                  "default": true,
                  "name": "C.O.R.T.E.X",
                  "workspace": "/home/node/.openclaw/workspace",
                  "agentDir": "/home/node/.openclaw/agents/main/agent"
                }
              ]
            },
            "models": {
              "providers": {
                "localai": {
                  "baseUrl": "http://local-ai-intel.ai.svc.cluster.local:8080/v1",
                  "apiKey": "not-needed",
                  "api": "openai-completions",
                  "models": [
                    {
                      "id": "qwen2.5-coder:7b",
                      "name": "Qwen 2.5 Coder 7B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    },
                    {
                      "id": "qwen2.5-coder:14b",
                      "name": "Qwen 2.5 Coder 14B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    }
                  ]
                }
              }
            },
            "auth": {
              "profiles": {
                "openai-codex:default": {
                  "provider": "openai-codex",
                  "mode": "oauth"
                }
              }
            },
            "gateway": {
              "port": 18789,
              "mode": "local",
              "bind": "lan",
              "auth": {
                "mode": "token"
              },
              "controlUi": {
                "allowedOrigins": ["https://openclaw-xunholy.${SECRET_DOMAIN}"]
              }
            },
            "messages": {
              "ackReactionScope": "group-mentions",
              "responsePrefix": "[{provider}/{model}]"
            },
            "logging": {
              "level": "info",
              "consoleLevel": "info",
              "consoleStyle": "compact",
              "redactSensitive": "tools"
            },
            "tools": {
              "profile": "full",
              "web": {
                "search": {
                  "enabled": false
                },
                "fetch": {
                  "enabled": true
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: openclaw
