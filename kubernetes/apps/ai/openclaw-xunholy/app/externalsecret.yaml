---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-xunholy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openclaw-xunholy-secret
    template:
      data:
#        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
#        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
#        OPENCLAW_GATEWAY_PASSWORD: "{{ .OPENCLAW_GATEWAY_PASSWORD }}"
        # SLACK API TOKENS
        SLACK_APP_TOKEN: "{{ .SLACK_OPENCLAW_APP_TOKEN }}"
        SLACK_BOT_TOKEN: "{{ .SLACK_OPENCLAW_BOT_USER_OAUTH_TOKEN }}"
        SLACK_BOT_USER_OAUTH_TOKEN: "{{ .SLACK_BOT_USER_OAUTH_TOKEN }}"
        SLACK_SIGNING_SECRET: "{{ .SLACK_OPENCLAW_APP_SIGNING_SECRET }}"
        SLACK_TALOS_HOMELAB_APP_TOKEN: "{{ .SLACK_TALOS_HOMELAB_APP_TOKEN }}"
        SLACK_USERID_ME: "{{ .SLACK_USERID_ME }}"
        SLACK_DEVOPS_CHANNEL_ID: "{{ .SLACK_DEVOPS_CHANNEL_ID }}"
        SLACK_CLAW_CHANNEL_ID: "{{ .SLACK_CLAW_CHANNEL_ID }}"
        # TELEGRAM API TOKENS
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        # Gemini API Key
        GEMINI_API_KEY: "{{ .OPENCLAW_GEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: slackapi
    - extract:
        key: telegram-bot
---
# yaml-language-server: $schema=https://kubernetes-schemas.nerdz.cloud/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-xunholy-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        openclaw.json: |
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "bind": "lan",
              "auth": {
                "mode": "token",
                "rateLimit": {
                  "maxAttempts": 10,
                  "windowMs": 60000,
                  "lockoutMs": 300000
                }
              },
              "controlUi": {
                "allowedOrigins": ["https://miso.davidstewen.com", "https://miso-chat.davidstewen.com", "https://mission-control.davidstewen.com"]
              },
              "trustedProxies": ["10.42.0.0/16", "192.168.0.0/16"]
            },
            "agents": {
              "defaults": {
                "model": {
                  "primary": "google/gemini-3-flash",
                  "fallbacks": [
                    "localai/qwen2.5-coder:14b",
                    "localai/qwen2.5-coder:7b",
                    "localai/qwen3.5:9b",
                    "localai/gemma3:4b"
                  ]
                },
                "userTimezone": "UTC+11",
                "maxConcurrent": 4,
                "timeoutSeconds": 300,
                "contextPruning": {
                  "mode": "cache-ttl",
                  "ttl": "1h",
                  "keepLastAssistants": 3,
                  "softTrimRatio": 0.3,
                  "hardClearRatio": 0.5
                }
              },
              "list": [
                {
                  "id": "main",
                  "default": true,
                  "name": "C.O.R.T.E.X",
                  "workspace": "/home/node/.openclaw/workspace",
                  "agentDir": "/home/node/.openclaw/agents/main/agent",
                  "model": {
                    "primary": "google/gemini-3-flash"
                  }
                },
                {
                  "id": "devops",
                  "name": "DevOps SRE",
                  "workspace": "/home/node/.openclaw/workspace-devops",
                  "agentDir": "/home/node/.openclaw/agents/devops/agent",
                  "model": {
                    "primary": "google/gemini-3-flash"
                  },
                  "identity": {
                    "name": "DevOps Bot",
                    "emoji": "🛠️"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@devops", "@sre"]
                  },
                  "heartbeat": {
                    "every": "30m",
                    "target": "slack",
                    "directPolicy": "allow",
                    "to": "channel:{{ .SLACK_DEVOPS_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                }
              ]
            },
            "bindings": [
              {
                "agentId": "devops",
                "match": {
                  "channel": "slack",
                  "peer": { "kind": "channel", "id": "{{ .SLACK_DEVOPS_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "main",
                "match": {
                  "channel": "slack",
                  "peer": { "kind": "channel", "id": "{{ .SLACK_CLAW_CHANNEL_ID }}" }
                }
              }
            ],
            "models": {
              "providers": {
                "localai": {
                  "baseUrl": "http://local-ai-intel.ai.svc.cluster.local:8080/v1",
                  "apiKey": "not-needed",
                  "api": "openai-completions",
                  "models": [
                    {
                      "id": "qwen2.5-coder:7b",
                      "name": "Qwen 2.5 Coder 7B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    },
                    {
                      "id": "qwen2.5-coder:14b",
                      "name": "Qwen 2.5 Coder 14B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    },
                    {
                      "id": "gemma3:4b",
                      "name": "Gemma 3 4B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    },
                    {
                      "id": "gemma3:12b",
                      "name": "Gemma 3 12B (Local)",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 32768,
                      "maxTokens": 8192
                    }
                  ]
                },
                "google": {
                  "baseUrl": "https://generativelanguage.googleapis.com/v1beta",
                  "apiKey": "{{ .OPENCLAW_GEMINI_API_KEY }}",
                  "api": "openai-completions",
                  "models": [
                    {
                      "id": "gemini-3-flash",
                      "name": "Gemini 3 Flash",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }
                    }
                  ]
                }
              }
            },
            "channels": {
              "telegram": {
                "enabled": true,
                "dmPolicy": "pairing",
                "allowFrom": ["tg:8563838649"],
                "groups": {
                  "*": {
                    "requireMention": true
                  }
                }
              },
              "slack": {
                "enabled": true,
                "mode": "socket",
                "dmPolicy": "allowlist",
                "allowFrom": ["U058PJACLBS"],
                "botToken": "${SLACK_BOT_TOKEN}",
                "appToken": "${SLACK_APP_TOKEN}",
                "signingSecret": "${SLACK_SIGNING_SECRET}",
                "groupPolicy": "allowlist",
                "channels": {
                "#test-channel": {
                  "allow": true,
                  "requireMention": true,
                  "allowBots": true,
                  "skills": ["docs"],
                  "systemPrompt": "Short answers only."
                  },
                "#coder-agent": {
                  "allow": true,
                  "requireMention": true,
                  "allowBots": true,
                  "skills": ["docs"],
                  "systemPrompt": "Short answers only."
                  }
                },
                "actions": {
                  "messages": true,
                  "search": true,
                  "reactions": true,
                  "permissions": false,
                  "pins": true,
                  "channelInfo": false
                },
                "slashCommand": {
                  "enabled": true,
                  "name": "openclaw",
                  "sessionPrefix": "slack:slash",
                  "ephemeral": true
                }
              }
            },
            "session": {
              "dmScope": "main",
              "reset": {
                "mode": "idle",
                "idleMinutes": 1440
              },
              "maintenance": {
                "mode": "enforce",
                "pruneAfter": "7d",
                "maxEntries": 1000,
                "rotateBytes": "100mb",
                "resetArchiveRetention": "7d"
              }
            },
            "messages": {
              "ackReactionScope": "group-mentions",
              "responsePrefix": "[{provider}/{model}]"
            },
            "logging": {
              "level": "info",
              "consoleLevel": "info",
              "consoleStyle": "compact",
              "redactSensitive": "tools"
            },
            "tools": {
              "agentToAgent": {
                "enabled": true,
                "allow": ["main", "devops"]
              },
              "profile": "full",
              "sessions": {
                "visibility": "all"
              },
              "web": {
                "search": {
                  "enabled": false
                },
                "fetch": {
                  "enabled": true
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: slackapi
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-mission-control
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        AUTH_USER: "{{ .username }}"
        AUTH_PASS: "{{ .password }}"
        API_KEY: "{{ .API_KEY }}"
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        # Gemini API Key
        GEMINI_API_KEY: "{{ .OPENCLAW_GEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: mission-control
  data:
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: openclaw
        property: OPENCLAW_GATEWAY_TOKEN
