---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw-xunholy
  namespace: ai
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - 'openclaw-xunholy.${SECRET_DOMAIN}'
  rules:
    - backendRefs:
        - name: openclaw-xunholy
          port: 18789
          weight: 100
