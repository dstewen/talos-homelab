---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-xunholy-config
data:
  openclaw.json: |
    {
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "lan",
        "auth": {
          "mode": "password"
        },
        "controlUi": {
          "allowedOrigins": ["https://openclaw-xunholy.${SECRET_DOMAIN}"]
        }
      },
      "browser": {
        "enabled": true
      },
      "agents": {
        "defaults": {
          "workspace": "/home/node/.openclaw/workspace",
          "model": {
            "primary": "localai/qwen2.5-coder__14b",
            "fallbacks": [
              "localai/qwen2.5-coder__7b"
            ]
          },
          "userTimezone": "UTC",
          "timeoutSeconds": 600,
          "maxConcurrent": 1
        },
        "list": [
          {
            "id": "main",
            "default": true,
            "identity": {
              "name": "OpenClaw"
            }
          }
        ]
      },
      "models": {
        "providers": {
          "localai": {
            "baseUrl": "http://local-ai.ai.svc.cluster.local:8080/v1",
            "apiKey": "not-needed",
            "api": "openai-completions",
            "models": [
              {
                "id": "qwen2.5-coder__7b",
                "name": "Qwen 2.5 Coder 7B (Local)",
                "reasoning": false,
                "input": ["text"],
                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                "contextWindow": 32768,
                "maxTokens": 8192
              },
              {
                "id": "qwen2.5-coder__14b",
                "name": "Qwen 2.5 Coder 14B (Local)",
                "reasoning": false,
                "input": ["text"],
                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                "contextWindow": 32768,
                "maxTokens": 8192
              }
            ]
          }
        }
      },
      "session": {
        "scope": "per-sender",
        "store": "/home/node/.openclaw/sessions",
        "reset": {
          "mode": "idle",
          "idleMinutes": 60
        }
      },
      "channels": {
        "slack": {
          "enabled": true,
          "mode": "socket",
          "dmPolicy": "pairing",
          "allowFrom": ["*"],
          "botToken": "{{ .SLACK_BOT_TOKEN }}",
          "appToken": "{{ .SLACK_APP_TOKEN }}",
          "channels": {
             "C0AM3KEJF34": { allow: true, requireMention: true, allowBots: false },
          "#test-channel": {
            "allow": true,
            requireMention: true,
            },
          },
          "actions": {
            "messages": true,
            "search": true,
            "reactions": true,
            "permissions": false,
            "pins": true,
            "channelInfo": false,
          },
        }
      },
      "logging": {
        "level": "info",
        "consoleLevel": "info",
        "consoleStyle": "compact",
        "redactSensitive": "tools"
      },
      "tools": {
        "profile": "full",
        "web": {
          "search": {
            "enabled": false
          },
          "fetch": {
            "enabled": true
          }
        }
      }
    }
