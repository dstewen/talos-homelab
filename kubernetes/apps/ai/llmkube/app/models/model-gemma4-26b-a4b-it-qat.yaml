      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          igpu-workload: "true"
  contextSize: 131072
  parallelSlots: 2
  flashAttention: true
  batchSize: 1024
  uBatchSize: 512
  extraArgs:
