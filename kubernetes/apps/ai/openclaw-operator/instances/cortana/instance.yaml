---
# yaml-language-server: $schema=https://raw.githubusercontent.com/openclaw-rocks/openclaw-operator/main/config/crd/bases/openclaw.rocks_openclawinstances.yaml
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: cortana
  namespace: ai
spec:
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: 2026.5.4-beta.3@sha256:9782c78aa1f613a8bcea5ac882de2d8c393d82b5857d6ea7a4bf72049e0478de
  selfConfigure:
    enabled: true
    allowedActions:
      - skills
      - config
      - envVars
      - workspaceFiles
  security:
    networkPolicy:
      enabled: true
      allowedIngressNamespaces:
        - "network"
      additionalEgress:
        - ports:
            - port: 22
              protocol: TCP
            - port: 443
              protocol: TCP
            - port: 8000
              protocol: TCP
            - port: 50000
              protocol: TCP
    rbac:
      createServiceAccount: true
  skills:
    - asleep123/caldav-calendar
    - pskoett/self-improving-agent
    - steipete/1password
    - steipete/brave-search
    - steipete/camsnap
    - steipete/discord
    - steipete/gemini
    - steipete/github
    - steipete/gog
    - steipete/mcporter
    - steipete/obsidian
    - steipete/openai-whisper
    - steipete/qmd
  envFrom:
    - secretRef:
        name: openclaw-cortana-secret
  env:
    - name: PATH
      value: "/tools/bin:/home/openclaw/.openclaw/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: TALOSCONFIG
      value: "/home/openclaw/.openclaw/talos/config"
    - name: OPENAI_API_KEY
      value: "not-needed"
    - name: OPENAI_BASE_URL
      value: "http://ollama.ai.svc:11434/v1"

  initContainers:

    - name: install-tools
      image: curlimages/curl:8.20.0@sha256:b3f1fb2a51d923260350d21b8654bbc607164a987e2f7c84a0ac199a67df812a
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -euo pipefail
          mkdir -p /tools/bin /tools/home /tools/mise

          # Redirect all mise state to the shared tools volume
          export HOME=/tools/home
          export MISE_DATA_DIR=/tools/mise
          export MISE_CACHE_DIR=/tools/mise/cache
          export MISE_STATE_DIR=/tools/mise/state
          export MISE_CONFIG_FILE=/tools/mise.toml

          # Install mise (using musl binary for Alpine compatibility)
          curl -fsSL https://github.com/jdx/mise/releases/download/v2026.4.5/mise-v2026.4.5-linux-x64-musl > /tools/bin/mise
          chmod +x /tools/bin/mise

          /tools/bin/mise install --yes

          # Symlink from mise managed paths to /tools/bin
          ln -sf "$(/tools/bin/mise which gh)" /tools/bin/gh
          ln -sf "$(/tools/bin/mise which kubectl)" /tools/bin/kubectl
          ln -sf "$(/tools/bin/mise which talosctl)" /tools/bin/talosctl
      volumeMounts:
        - name: tools
          mountPath: /tools
        - name: mise-config
          mountPath: /tools/mise.toml
          subPath: mise.toml
  extraVolumes:
    - name: tools
      emptyDir: {}
    - name: mise-config
      configMap:
        name: cortana-mise-config
    - name: talos-config
      secret:
        secretName: openclaw-cortana-secret
        items:
          - key: TALOS_CONFIG
            path: config
  extraVolumeMounts:
    - name: tools
      mountPath: /tools
    - name: talos-config
      mountPath: /home/openclaw/.openclaw/talos/config
      subPath: config
  observability:
    metrics:
      grafanaDashboard:
        enabled: true
        folder: OpenClaw  # Grafana folder (default)
        labels:
          grafana_dashboard: "true"

  storage:
    persistence:
      enabled: true
      existingClaim: openclaw-cortana
  config:
    mergeMode: "merge"
    raw:

      agents:
        defaults:
          model:
            primary: "groq/meta-llama/llama-4-scout-17b-16e-instruct"
            fallbacks:
             - "ollama-rig/gemma4:e4b"
             - "ollama/gemma4:e4b-it-q4_K_M"

      gateway:
        port: 18789
        controlUi:
          allowedOrigins:
            - "https://cortana.davidstewen.com"
          dangerouslyDisableDeviceAuth: true

      models:
        providers:
          ollama-rig:
            baseUrl: "http://192.168.10.80:11434"
            apiKey: "not-needed"
            api: "ollama"
            timeoutSeconds: 300
            models:
              - id: "gemma4:e4b"
                name: "Gemma 4 E4B (Ollama-Rig Server)"
                reasoning: false
                input:
                  - text
                  - image
                cost:
                  input: 0
                  output: 0
                  cacheRead: 0
                  cacheWrite: 0
                contextWindow: 262144
                maxTokens: 8192
          ollama:
            baseUrl: "http://ollama.ai.svc.cluster.local:11434"
            apiKey: "not-needed"
            api: "ollama"
            timeoutSeconds: 300
            models:
              - id: "gemma4:e4b-it-q4_K_M"
                name: "Gemma 4 E4B (Ollama Talos Server)"
                reasoning: false
                input:
                  - text
                  - image
                cost:
                  input: 0
                  output: 0
                  cacheRead: 0
                  cacheWrite: 0
                contextWindow: 262144
                maxTokens: 8192
      messages:
        groupChat:
          visibleReplies: "message_tool"
