---
# This complements the Valkey ingress rule when the app namespace is default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-allow-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: core-dns
              app.kubernetes.io/name: core-dns
      ports:
        - port: 53
          protocol: UDP
