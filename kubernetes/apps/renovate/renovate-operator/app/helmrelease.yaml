---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    fullnameOverride: renovate-operator
    auth:
      oidc:
        enabled: false
        existingSecret: renovate-operator-oidc-credentials
        issuerUrl: https://id.davidstewen.com/application/o/renovate-operator/
        secretKey: RENOVATE_OPERATOR_CLIENT_SECRET
        sessionSecretKey: RENOVATE_OPERATOR_SESSION_SECRET
    metrics:
      enabled: true
      serviceMonitor:
        # -- whether to create a ServiceMonitor for the operator metrics
        enabled: true
        # -- scrape interval for the ServiceMonitor, defaults to Prometheus global scrape interval
#        interval: ~
      dashboard:
        # -- whether to create a Grafana dashboard for the operator metrics
        enabled: true
        annotations: {}
        labels:
          grafana_dashboard: "true"
        # -- namespace to create the dashboard in, defaults to the release namespace
#        namespace: ~
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Update-Management
        gethomepage.dev/name: Removate-Operator
        gethomepage.dev/icon: renovate.png
        gethomepage.dev/pod-selector: app.kubernetes.io/controller=renovate-operator
        gethomepage.dev/href: https://renovate.davidstewen.com
      hostnames:
        - renovate.davidstewen.com
      parentRefs:
        - name: envoy-internal
          namespace: network
    webhook:
      enabled: true
  valuesFrom:
    - kind: Secret
      name: renovate-operator-oidc-credentials
      valuesKey: RENOVATE_OPERATOR_CLIENT_ID
      targetPath: auth.oidc.clientId
