# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://10.200.15.254:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.200.15.254"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "ms1"
    ipAddress: "10.200.15.51"
    installDiskSelector:
      serial: "1925E20E2038"
    userVolumes:
      - name: local-hostpath-2tb
        provisioning:
          diskSelector:
            match: "disk.model.startsWith('WD_BLACK')"
          minSize: 1TB
          maxSize: 1TB
#        filesystem:
#          type: xfs
    patches:
      - "@./patches/ms1/openebs-local.yaml"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/743d942690991fb5b20d07e54b6d33c60b19d7918e14d61173d79e718ebc0b47
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "58:47:ca:77:cf:38"
        ignore: true
        # Intel VPRO
      - deviceSelector:
          hardwareAddr: "58:47:ca:77:cf:39"
        ignore: true
        #bond0
      # Explicit NIC names instead of deviceSelectors: talhelper 3.1.x splits
      # bond+vlan into modular configs (BondConfig/VLANConfig kinds) when
      # deviceSelectors is used, and silently drops VIP during that translation.
      # All three MS-01 hosts have identical X710 NIC naming.
      - interface: bond0
        bond:
          mode: 802.3ad
          interfaces:
            - enp2s0f0np0
            - enp2s0f1np1
          xmitHashPolicy: layer3+4
          lacpRate: fast
          miimon: 100
          downdelay: 200
          updelay: 200
#        dhcp: false
#        addresses:
#          - "10.200.15.51/24"
#        routes:
#          - network: "0.0.0.0/0"
#            gateway: "10.200.15.1"
#            metric: 1
        mtu: 1500
        # VIP is configured via talos/patches/controller/vip.yaml — talhelper
        # silently drops VIP fields when translating bond+vlan into modular
        # configs, so we add it post-translation as a controller-only patch.
#        vip:
#          ip: "10.200.15.254"
        vlans:
          # HomeLABServers VLAN
          - vlanId: 15
            dhcp: false
            addresses:
              - 10.200.15.51/24
            mtu: 1500
            routes:
              - network: 0.0.0.0/0
                gateway: 10.200.15.1
                metric: 1
#            vip:
#              ip: 10.200.15.254
          # K3S_Services_VLAN
          - vlanId: 20
            dhcp: false
            mtu: 1500
          # Provisioning VLAN
          - vlanId: 30
            dhcp: false
            mtu: 1500
          # IOT VLAN
          - vlanId: 100
            dhcp: false
            mtu: 1500
          # GuestWifi VLAN
          - vlanId: 110
            dhcp: false
            mtu: 1500
    extensionServices:
      - name: nut-client
        configFiles:
          - content: |-
              MONITOR ups@192.168.10.23 1 upsmon_local mypassword secondary
              SHUTDOWNCMD "/sbin/poweroff"
            mountPath: /usr/local/etc/nut/upsmon.conf
      - name: lldpd
        configFiles:
          - mountPath: /usr/local/etc/lldpd/lldpd.conf
            content: |
              configure lldp portidsubtype ifname
              unconfigure lldp management-addresses-advertisements
              unconfigure lldp capabilities-advertisements
              configure system description "Talos Controller Node MS1"
