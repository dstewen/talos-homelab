---
clusterName: kubernetes
clusterEndpoint: https://10.200.15.254:6443

kubernetesVersion: "${kubernetesVersion}"

nodes:
  - host: "ms1"
    ip: "10.200.15.51"
    role: control-plane

  - host: "ms2"
    ip: "10.200.15.52"
    role: control-plane

  - host: "ms3"
    ip: "10.200.15.53"
    role: control-plane

# Intel NUC workers
  - host: "nuc1"
    ip: "10.200.15.61"
    role: worker

  - host: "nuc2"
    ip: "10.200.15.62"
    role: worker

# CM4 Blades - with EMMC storage formatted as FAT32 and erased - using NVME for OS drive
  - host: "blade2"
    ip: "10.200.15.32"
    role: worker

  - host: "blade4"
    ip: "10.200.15.34"
    role: worker

  - host: "blade5"
    ip: "10.200.15.35"
    role: worker

  - host: "blade6"
    ip: "10.200.15.36"
    role: worker

  - host: "blade7"
    ip: "10.200.15.37"
    role: worker

  - host: "blade8"
    ip: "10.200.15.38"
    role: worker

# Global patches
patches:
#  - "@./patches/global/machine-files.yaml"
#  - "@./patches/global/machine-files-nfs.yaml"
#  - "@./patches/global/machine-hostdns.yaml"
#  - "@./patches/global/machine-kubelet.yaml"
#  - "@./patches/global/machine-network.yaml"
#  - "@./patches/global/machine-sysctls.yaml"
#  - "@./patches/global/machine-time.yaml"
#  - "@./patches/global/openebs-local.yaml"



# Configure NFS mount options
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          resolveMemberNames: true
          forwardKubeDNSToHost: false



      files:
        # Configure nfs mount options
        - op: overwrite
          path: /etc/nfsmount.conf
          permissions: 0o644
          content: |
            [ NFSMount_Global_Options ]
            nfsvers=4.1
            hard=True
            nconnect=16
            noatime=True

        # configure containerd for spegel and Intel DRA
        - content: |
            [plugins."io.containerd.cri.v1.images"]
              discard_unpacked_layers = false
            [plugins."io.containerd.cri.v1.runtime"]
              cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
              device_ownership_from_security_context = true
          path: /etc/cri/conf.d/20-customization.part
          permissions: 0o644
          op: create

      kubelet:
        extraConfig:
          serializeImagePulls: false
        nodeIP:
          validSubnets:
            - 10.200.15.0/24

      network:
        disableSearchDomain: true
        nameservers:
          - 192.168.10.195
          - 1.1.1.1

      sysctls:
        fs.inotify.max_user_watches: "1048576" # Watchdog
        fs.inotify.max_user_instances: "8192"  # Watchdog
        net.core.rmem_max: "7500000" # Cloudflared | QUIC
        net.core.wmem_max: "7500000" # Cloudflared | QUIC
        vm.nr_hugepages: 1024        # PostgreSQL

      time:
        disabled: false
        servers:
          - 162.159.200.1
          - 162.159.200.123


# Controller patches
controlPlane:

  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/gasket-driver    # Google Coral M.2
          - siderolabs/i915             # MS-01 CPU iGraphics
          - siderolabs/intel-ucode      # Intel ucode
          - siderolabs/mei
          - siderolabs/thunderbolt      # Thunderbolt networking
          - siderolabs/xe               # Intel Xe Graphics
      extraKernelArgs:
        - -selinux # apparently needed for talos 1.10.x
        - -init_on_alloc # Less security, more speed
        - -init_on_free # Less security, more speed
        - apparmor=0 # Less security, more speed
        - i915.enable_guc=3                   # Meteor Lake CPU / iGPU - Enable GuC and HuC for better graphics performance and stability
        - i915.force_probe=!a7a0              # Disable iGPU deviceID for i915
        - xe.force_probe=a7a0                 # Enable iGPU deviceID for xe
        - init_on_alloc=0                     # Less security, faster puter
        - init_on_free=0                      # Less security, faster puter
        - intel_iommu=on # PCI Passthrough
        - iommu=pt # PCI Passthrough
        - mitigations=off # Less security, more speed
        - security=none # Less security, more speed
        - talos.auditd.disabled=1 # Less security, more speed
  #      - net.ifnames=1 # Enable predictable NIC naming
  patches:
#    - "@./patches/controller/admission-controller-patch.yaml"
#    - "@./patches/controller/cluster.yaml"
#    - "@./patches/controller/enable-talos-api.yaml"
#    - "@./patches/controller/machine-install.yaml"

    # Enable K8s Talos API Access
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - actions-runner-system
              - system-upgrade

    # Cluster Configuration
    - |-
      cluster:
        allowSchedulingOnControlPlanes: true
        apiServer:
          # disable default API server admission plugins
          admissionControl:
            $$patch: delete
          # enable apiserver feature-gates and runtime-config - needed for volsync
          extraArgs:
            feature-gates: ImageVolume=true,MutatingAdmissionPolicy=true
            runtime-config: admissionregistration.k8s.io/v1beta1=true
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        coreDNS:
          disabled: true
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
          advertisedSubnets:
            - 10.200.15.0/24
        proxy:
          disabled: true
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0

    # Custom sysfs settings
    - |-
      machine:
        sysfs:
          devices.system.cpu.intel_pstate.hwp_dynamic_boost: 1
          devices.system.cpu.cpu0.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu1.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu2.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu3.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu4.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu5.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu6.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu7.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu8.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu9.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu10.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu11.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu12.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu13.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu14.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu15.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu16.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu17.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu18.cpufreq.energy_performance_preference: balance_performance
          devices.system.cpu.cpu19.cpufreq.energy_performance_preference: balance_performance

    # Enable thunderbolt + net
    - |-
      machine:
        kernel:
          modules:
            - name: nbd
            - name: thunderbolt
            - name: thunderbolt_net

    # Various udev rules
    - |-
      machine:
        udev:
          rules:
            # Thunderbolt
            - ACTION=="add", SUBSYSTEM=="thunderbolt", ATTR{authorized}=="0", ATTR{authorized}="1"
            # Intel GPU
            - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
            # Coral Edge TPU
            - SUBSYSTEM=="apex", KERNEL=="apex*", GROUP="44", MODE="0660"
