hostname: ms3
ipAddress: 10.200.15.53
controlPlane: true
installDiskSelector:
  serial: "22061X806789"
talosImageURL: factory.talos.dev/installer/743d942690991fb5b20d07e54b6d33c60b19d7918e14d61173d79e718ebc0b47
machineSpec:
  secureboot: false
userVolumes:
  - name: local-hostpath-2tb
    provisioning:
      diskSelector:
        match: "disk.model.startsWith('WD_BLACK')"
      minSize: 1TB
      maxSize: 1TB
networkInterfaces:
  - deviceSelector:
      hardwareAddr: "58:47:ca:78:f8:4c"
    ignore: true
  - deviceSelector:
      hardwareAddr: "58:47:ca:78:f8:4d"
    ignore: true
  - interface: bond0
    bond:
      mode: active-backup
      deviceSelectors:
        - hardwareAddr: "58:47:ca:78:f8:4a"
          driver: i40e
    dhcp: false
    addresses:
      - "10.200.15.53/24"
    routes:
      - network: "0.0.0.0/0"
        gateway: "10.200.15.1"
        metric: 1
    mtu: 1500
    vip:
      ip: "10.200.15.254"
    vlans:
      - vlanId: 20
        dhcp: false
        mtu: 1500
      - vlanId: 30
        dhcp: false
        mtu: 1500
      - vlanId: 100
        dhcp: false
        mtu: 1500
      - vlanId: 110
        dhcp: false
        mtu: 1500
extensionServices:
  - name: nut-client
    configFiles:
      - content: |-
          MONITOR ups@192.168.10.23 1 upsmon_local mypassword secondary
          SHUTDOWNCMD "/sbin/poweroff"
        mountPath: /usr/local/etc/nut/upsmon.conf
  - name: lldpd
    configFiles:
      - mountPath: /usr/local/etc/lldpd/lldpd.conf
        content: |
          configure lldp portidsubtype ifname
          unconfigure lldp management-addresses-advertisements
          unconfigure lldp capabilities-advertisements
          configure system description "Talos Controller Node MS3"
patches:
  - import: ../patches/ms3_openebs.yaml
