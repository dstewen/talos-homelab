# This is the main entry point for the topf tool.
# It dictates the entire rendering order and the primary template to use.

# Define the main configuration structure here.
# The final output manifest will be rendered using the cluster_manifest.yaml.tpl
# which correctly loops through all nodes.

# --- Core Definition ---
# The top-level structure required by the topf tool.
cluster:
  # Reference the cluster-wide settings
  data:
    cluster: data/cluster.yaml

  # Reference all node definitions
  nodes: data/nodes.yaml

  # Point to the primary rendering template
  template: templates/cluster_manifest.yaml.tpl
