# ------------------------------------------------------------------------------
# TOPF Node Definitions based on talconfig.yaml & kubectl get nodes -o wide
# Contains definitions for all 8 nodes: 3x MS1, 2x NUC, 5x Blades
# ------------------------------------------------------------------------------

nodes:
  - host: "ms1"
    ip: "10.200.15.51"
    role: control-plane

  - host: "ms2"
    ip: "10.200.15.52"
    role: control-plane

  - host: "ms3"
    ip: "10.200.15.53"
    role: control-plane

# Intel NUC workers
  - host: "nuc1"
    ip: "10.200.15.61"
    role: worker

  - host: "nuc2"
    ip: "10.200.15.62"
    role: worker

# CM4 Blades - with EMMC storage formatted as FAT32 and erased - using NVME for OS drive
  - host: "blade2"
    ip: "10.200.15.32"
    role: worker

  - host: "blade4"
    ip: "10.200.15.34"
    role: worker

  - host: "blade5"
    ip: "10.200.15.35"
    role: worker

  - host: "blade6"
    ip: "10.200.15.36"
    role: worker

  - host: "blade7"
    ip: "10.200.15.37"
    role: worker

  - host: "blade8"
    ip: "10.200.15.38"
    role: worker
