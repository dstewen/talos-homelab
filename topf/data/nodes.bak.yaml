# ------------------------------------------------------------------------------
# TOPF Node Definitions based on talconfig.yaml & kubectl get nodes -o wide
# Contains definitions for all 8 nodes: 3x MS1, 2x NUC, 5x Blades
# ------------------------------------------------------------------------------

nodes:
  # --- 🖥️ MS1 Nodes (amd64, Control Plane) ---
  - hostname: "ms1"
    ipAddress: "10.200.15.51"
    installDiskSelector:
      serial: "1925E20E2038"
    userVolumes:
      - name: local-hostpath-2tb
        provisioning:
          diskSelector:
            match: "disk.model.startsWith('WD_BLACK')"
          minSize: 1TB
          maxSize: 1TB
    patches:
      - "@./patches/ms1/openebs-local.yaml"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/743d942690991fb5b20d07e54b6d33c60b19d7918e14d61173d79e718ebc0b47
    controlPlane: true
    networkInterfaces:
      # VPRO (No change)
      - deviceSelector: {hardwareAddr: "58:47:ca:77:cf:38", ignore: true}
      # bond0 (Active-Backup)
      - interface: bond0
        bond: {mode: active-backup, deviceSelectors: [{hardwareAddr: "58:47:ca:77:cf:36", driver: i40e}]}
        dhcp: false
        addresses: [{network: "0.0.0.0/0", gateway: "10.200.15.1", metric: 1}]
        mtu: 1500
        vip: {ip: "10.200.15.254"}
        vlans:
          - {vlanId: 20, dhcp: false, mtu: 1500}
          - {vlanId: 30, dhcp: false, mtu: 1500}
          - {vlanId: 100, dhcp: false, mtu: 1500}
          - {vlanId: 110, dhcp: false, mtu: 1500}
    extensionServices:
      - name: nut-client
        configFiles:
          - content: |
              MONITOR ups@192.168.10.23 1 upsmon_local mypassword secondary
              SHUTDOWNCMD "/sbin/poweroff"
            mountPath: /usr/local/etc/nut/upsmon.conf
      - name: lldpd
        configFiles:
          - mountPath: /usr/local/etc/lldpd/lldpd.conf
            content: |
              configure lldp portidsubtype ifname
              unconfigure lldp management-addresses-advertisements
              unconfigure lldp capabilities-advertisements
              configure system description "Talos Controller Node MS1"

